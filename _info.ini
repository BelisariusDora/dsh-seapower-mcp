[Language_en]
Name=Sea Power Agent Bridge
Description=Local HTTP control surface for AI agents. Exposes game state (units, taskforces, ammo) and issues orders (speed, course, move, attack, EMCON, radar/sonar, flight deck) over http://127.0.0.1:19080. Companion MCP server: tools/spmcp/mcp_server.py

[Language_cn]
Name=海权 Agent 桥接
Description=给 AI agent 用的本地 HTTP 控制接口。提供战场状态（单位 / 编组 / 弹药）并可下达命令（航速 / 航向 / 机动 / 攻击 / 电磁管制 / 雷达声呐 / 飞行甲板），监听 http://127.0.0.1:19080。配套 MCP 服务端：tools/spmcp/mcp_server.py

[Compatibility]
GreaterThanEqualToVersion=0.4.0
LessThanVersion=1.0.0

; agent inspector fixed text (English)
; Only chrome the bridge draws. Agent output, log lines, error
; codes and unit names are shown raw and are not translated.
; Key=Value, split on the first '='. A missing key falls back to
; the English file, then to the key name. This file is only
; written when it is missing - edit it freely.
[AgentInspector]
title=Agent Inspector
actions=input & actions - commands the agent issued
actions.empty=no agent commands yet
detail.select=select a row above to read the full event
status.starting=inspector
status.line=events {0}   shown {1}   cache {2}MB   dropped {3}   {4}   toggle {5}
status.hold_on=hold on
status.hold_off=hold off
detail.page=lines {0}-{1} of {2} - scroll to page
detail.capped=(body truncated at the display cap)
